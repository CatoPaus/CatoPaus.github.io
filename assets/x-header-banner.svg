<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Cato Paus Skrede — X Header Banner">
  <defs>
    <linearGradient id="bgX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A11" />
      <stop offset="55%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#070E18" />
    </linearGradient>
    <linearGradient id="lineX" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glowCyanX" cx="22%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmeraldX" cx="85%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmberX" cx="72%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridX" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1500" height="500" fill="url(#bgX)" />
  <rect width="1500" height="500" fill="url(#gridX)" />
  <rect width="1500" height="500" fill="url(#glowCyanX)" />
  <rect width="1500" height="500" fill="url(#glowEmeraldX)" />
  <rect width="1500" height="500" fill="url(#glowAmberX)" />

  <!-- Subtle Decorative Rack Frame -->
  <rect x="24" y="24" width="1452" height="452" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <g stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.75">
    <path d="M 24 54 L 24 24 L 54 24" />
    <path d="M 1446 24 L 1476 24 L 1476 54" />
    <path d="M 24 446 L 24 476 L 54 476" />
    <path d="M 1446 476 L 1476 476 L 1476 446" />
  </g>

  <!-- Upper-Left Decorative Circuit / Mesh Topology (stays clear of bottom-left avatar overlap) -->
  <g transform="translate(68, 72)" opacity="0.72">
    <circle cx="8" cy="8" r="5" fill="#34D399" />
    <circle cx="8" cy="8" r="11" fill="#34D399" opacity="0.16" />
    <text x="26" y="13" class="mono" font-size="14" fill="#94A3B8" letter-spacing="1.6">NODE // CATOPAUS.GITHUB.IO</text>

    <!-- Stylized 4-socket mesh topology diagram in upper-left -->
    <g transform="translate(0, 56)" stroke="#1E293B" stroke-width="1.5" fill="#0B111E">
      <line x1="56" y1="34" x2="174" y2="34" stroke="#38BDF8" stroke-opacity="0.45" stroke-dasharray="4 4" />
      <line x1="56" y1="34" x2="56" y2="112" stroke="#34D399" stroke-opacity="0.45" stroke-dasharray="4 4" />
      <line x1="174" y1="34" x2="174" y2="112" stroke="#F59E0B" stroke-opacity="0.45" stroke-dasharray="4 4" />
      <line x1="56" y1="112" x2="174" y2="112" stroke="#A78BFA" stroke-opacity="0.45" stroke-dasharray="4 4" />

      <rect x="6" y="10" width="100" height="48" rx="8" stroke="#38BDF8" stroke-opacity="0.65" />
      <text x="56" y="31" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#38BDF8">NODE_0</text>
      <text x="56" y="47" text-anchor="middle" class="mono" font-size="10" fill="#94A3B8">GENKIT</text>

      <rect x="124" y="10" width="100" height="48" rx="8" stroke="#34D399" stroke-opacity="0.65" />
      <text x="174" y="31" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#34D399">NODE_1</text>
      <text x="174" y="47" text-anchor="middle" class="mono" font-size="10" fill="#94A3B8">GEMINI 4</text>

      <rect x="6" y="88" width="100" height="48" rx="8" stroke="#A78BFA" stroke-opacity="0.65" />
      <text x="56" y="109" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#A78BFA">NODE_2</text>
      <text x="56" y="125" text-anchor="middle" class="mono" font-size="10" fill="#94A3B8">C++ N-API</text>

      <rect x="124" y="88" width="100" height="48" rx="8" stroke="#F59E0B" stroke-opacity="0.65" />
      <text x="174" y="109" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F59E0B">NODE_3</text>
      <text x="174" y="125" text-anchor="middle" class="mono" font-size="10" fill="#94A3B8">XEON NUMA</text>
    </g>
  </g>

  <!-- Top-Right TARS Badge -->
  <g transform="translate(1078, 62)">
    <rect x="0" y="0" width="354" height="34" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <text x="177" y="21.5" text-anchor="middle" class="mono" font-size="13.5" font-weight="600" fill="#38BDF8" letter-spacing="1.1">TARS_SETTINGS :: ZERO-BLOAT 100%</text>
  </g>

  <!-- Main Focal Block (Safely right of avatar safe zone x >= 450) -->
  <g transform="translate(460, 198)">
    <text x="0" y="0" class="sans" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1.4">Cato Paus Skrede</text>
    <text x="564" y="-4" class="mono" font-size="22" font-weight="600" fill="#38BDF8" letter-spacing="0.5">@cato_paus</text>
    <rect x="708" y="-23" width="11" height="24" rx="1.5" fill="#38BDF8" />

    <text x="0" y="48" class="sans" font-size="22" font-weight="500" fill="#CBD5E1">
      Independent AI &amp; Systems Lab · Firebase Genkit · Gemini · Bare-Metal NUMA
    </text>
    <text x="0" y="82" class="mono" font-size="15.5" fill="#64748B">
      &gt; TypeScript · Python · C++ N-API · Google Antigravity 2.0 · 4-Socket Xeon Mesh
    </text>
  </g>

  <!-- Accent Divider -->
  <rect x="460" y="324" width="972" height="2" fill="url(#lineX)" />

  <!-- Bottom Project Telemetry Pills (Safely right of avatar safe zone) -->
  <g transform="translate(460, 376)">
    <g>
      <rect x="0" y="-18" width="232" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="18" cy="0" r="4" fill="#38BDF8" />
      <text x="34" y="5" class="mono" font-size="13" font-weight="600" fill="#E2E8F0">open-knowledge-studio</text>
    </g>
    <g transform="translate(248, 0)">
      <rect x="0" y="-18" width="256" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="18" cy="0" r="4" fill="#34D399" />
      <text x="34" y="5" class="mono" font-size="13" font-weight="600" fill="#E2E8F0">genkit-turboquant-embedder</text>
    </g>
    <g transform="translate(520, 0)">
      <rect x="0" y="-18" width="236" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="18" cy="0" r="4" fill="#A78BFA" />
      <text x="34" y="5" class="mono" font-size="13" font-weight="600" fill="#E2E8F0">Antigravity-Agent-Mesh</text>
    </g>
    <g transform="translate(772, 0)">
      <rect x="0" y="-18" width="200" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="18" cy="0" r="4" fill="#F59E0B" />
      <text x="34" y="5" class="mono" font-size="13" font-weight="600" fill="#E2E8F0">github.com/CatoPaus</text>
    </g>
  </g>
</svg>
